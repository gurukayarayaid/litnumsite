<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Latihan Literasi Numerasi</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1>Literasi Numerasi</h1>
      <p class="subtitle">Latihan Interaktif Kelas 3 SD</p>

      <div class="login-tabs">
        <button class="login-tab active" onclick="switchTab('guru')">Guru</button>
        <button class="login-tab" onclick="switchTab('siswa')">Siswa</button>
      </div>

      <div id="alert-box"></div>

      <!-- Guru Login -->
      <form id="guru-form" class="login-form active" onsubmit="handleGuruLogin(event)">
        <div class="form-group">
          <label for="guru-username">Username</label>
          <input type="text" id="guru-username" class="form-control" placeholder="Masukkan username" required>
        </div>
        <div class="form-group">
          <label for="guru-password">Password</label>
          <input type="password" id="guru-password" class="form-control" placeholder="Masukkan password" required>
        </div>
        <button type="submit" class="login-btn">Masuk sebagai Guru</button>
      </form>

      <!-- Siswa Login -->
      <form id="siswa-form" class="login-form" onsubmit="handleSiswaLogin(event)">
        <div class="form-group">
          <label for="siswa-nis">NIS (Nomor Induk Siswa)</label>
          <input type="text" id="siswa-nis" class="form-control" placeholder="Masukkan NIS" required>
        </div>
        <div class="form-group">
          <label for="siswa-password">Password</label>
          <input type="password" id="siswa-password" class="form-control" placeholder="Masukkan password" required>
        </div>
        <button type="submit" class="login-btn">Masuk sebagai Siswa</button>
      </form>

      <p class="login-footer">
        Default guru: admin / admin123<br>
        Default siswa: NIS / 123456
      </p>
    </div>
  </div>

  <script>
    function switchTab(role) {
      document.querySelectorAll('.login-tab').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.login-form').forEach(form => form.classList.remove('active'));

      if (role === 'guru') {
        document.querySelector('.login-tab:first-child').classList.add('active');
        document.getElementById('guru-form').classList.add('active');
      } else {
        document.querySelector('.login-tab:last-child').classList.add('active');
        document.getElementById('siswa-form').classList.add('active');
      }
    }

    function showAlert(message, type = 'danger') {
      document.getElementById('alert-box').innerHTML =
        `<div class="alert alert-${type}">${message}</div>`;
    }

    async function handleGuruLogin(e) {
      e.preventDefault();
      const username = document.getElementById('guru-username').value;
      const password = document.getElementById('guru-password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, role: 'guru' })
        });
        const data = await res.json();

        if (data.success) {
          window.location.href = data.redirect;
        } else {
          showAlert(data.error);
        }
      } catch (err) {
        showAlert('Terjadi kesalahan, coba lagi');
      }
    }

    async function handleSiswaLogin(e) {
      e.preventDefault();
      const nis = document.getElementById('siswa-nis').value;
      const password = document.getElementById('siswa-password').value;

      try {
        const res = await fetch('/api/auth/login-student', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nis, password })
        });
        const data = await res.json();

        if (data.success) {
          window.location.href = data.redirect;
        } else {
          showAlert(data.error);
        }
      } catch (err) {
        showAlert('Terjadi kesalahan, coba lagi');
      }
    }

    // Check if already logged in
    fetch('/api/auth/me').then(r => r.json()).then(data => {
      if (data.user) {
        window.location.href = data.user.role === 'guru' ? '/teacher/dashboard' : '/student/dashboard';
      }
    }).catch(() => {});
  </script>
</body>
</html>
