<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Latihan Literasi Numerasi</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1>Literasi Numerasi</h1>
      <p class="subtitle">Latihan Interaktif Kelas 3 SD</p>

      <div class="login-tabs">
        <button class="login-tab active" onclick="switchTab('guru')">Guru</button>
        <button class="login-tab" onclick="switchTab('siswa')">Siswa</button>
      </div>

      <div id="alert-box"></div>

      <!-- Guru Login -->
      <form id="guru-form" class="login-form active" onsubmit="handleGuruLogin(event)">
        <div class="form-group">
          <label for="guru-password">Password Guru</label>
          <input type="password" id="guru-password" class="form-control" placeholder="Masukkan password guru" required>
        </div>
        <button type="submit" class="login-btn">Masuk sebagai Guru</button>
      </form>

      <!-- Siswa Login -->
      <form id="siswa-form" class="login-form" onsubmit="handleSiswaLogin(event)">
        <div class="form-group">
          <label for="siswa-class">Kelas</label>
          <select id="siswa-class" class="form-control" required onchange="loadStudents()">
            <option value="">-- Pilih Kelas --</option>
          </select>
        </div>
        <div class="form-group">
          <label for="siswa-name">Nama</label>
          <select id="siswa-name" class="form-control" required onchange="autoFillNIS()">
            <option value="">-- Pilih Nama --</option>
          </select>
        </div>
        <div class="form-group">
          <label for="siswa-nis">Password (NIS)</label>
          <input type="password" id="siswa-nis" class="form-control" placeholder="Otomatis terisi dari NIS" required>
        </div>
        <button type="submit" class="login-btn">Masuk sebagai Siswa</button>
      </form>
    </div>
  </div>

  <script>
    let allStudents = [];

    function switchTab(role) {
      document.querySelectorAll('.login-tab').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.login-form').forEach(form => form.classList.remove('active'));

      if (role === 'guru') {
        document.querySelector('.login-tab:first-child').classList.add('active');
        document.getElementById('guru-form').classList.add('active');
      } else {
        document.querySelector('.login-tab:last-child').classList.add('active');
        document.getElementById('siswa-form').classList.add('active');
      }
    }

    function showAlert(message, type = 'danger') {
      document.getElementById('alert-box').innerHTML =
        `<div class="alert alert-${type}">${message}</div>`;
    }

    async function loadClasses() {
      try {
        const res = await fetch('/api/auth/classes');
        const data = await res.json();
        const select = document.getElementById('siswa-class');
        data.classes.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c;
          opt.textContent = 'Kelas ' + c;
          select.appendChild(opt);
        });
      } catch (err) {
        console.error('Gagal memuat kelas');
      }
    }

    async function loadStudents() {
      const kelas = document.getElementById('siswa-class').value;
      const nameSelect = document.getElementById('siswa-name');
      const nisInput = document.getElementById('siswa-nis');

      nameSelect.innerHTML = '<option value="">-- Pilih Nama --</option>';
      nisInput.value = '';

      if (!kelas) return;

      try {
        const res = await fetch('/api/auth/students-by-class/' + kelas);
        const data = await res.json();
        allStudents = data.students;

        data.students.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.nis;
          opt.textContent = s.full_name;
          nameSelect.appendChild(opt);
        });
      } catch (err) {
        console.error('Gagal memuat data siswa');
      }
    }

    function autoFillNIS() {
      const nis = document.getElementById('siswa-name').value;
      document.getElementById('siswa-nis').value = nis;
    }

    async function handleGuruLogin(e) {
      e.preventDefault();
      const password = document.getElementById('guru-password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: 'admin', password, role: 'guru' })
        });
        const data = await res.json();

        if (data.success) {
          window.location.href = data.redirect;
        } else {
          showAlert(data.error);
        }
      } catch (err) {
        showAlert('Terjadi kesalahan, coba lagi');
      }
    }

    async function handleSiswaLogin(e) {
      e.preventDefault();
      const nis = document.getElementById('siswa-name').value;
      const password = document.getElementById('siswa-nis').value;

      if (!nis) {
        showAlert('Pilih nama siswa terlebih dahulu');
        return;
      }

      try {
        const res = await fetch('/api/auth/login-student', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nis, password })
        });
        const data = await res.json();

        if (data.success) {
          window.location.href = data.redirect;
        } else {
          showAlert(data.error);
        }
      } catch (err) {
        showAlert('Terjadi kesalahan, coba lagi');
      }
    }

    loadClasses();
  </script>
</body>
</html>
